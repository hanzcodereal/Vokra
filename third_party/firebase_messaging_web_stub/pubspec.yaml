name: firebase_messaging_web
description: Local no-op web stub for firebase_messaging to keep Chrome builds compiling.
version: 3.5.18
publish_to: 'none'

environment:
  sdk: ^3.8.1
  flutter: ">=3.22.0"

dependencies:
  firebase_core: ^2.14.0
  firebase_core_web: ^2.24.0
  firebase_messaging_platform_interface: ^4.5.37
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseMessagingWeb
        fileName: firebase_messaging_web.dart
